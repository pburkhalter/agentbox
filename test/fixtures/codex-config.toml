# Mounted over /etc/codex/config.toml in the smoke test's cli-bridge
# container: the image's settings, plus a model provider that is the fake
# Responses API (test/fake_responses.py) instead of OpenAI. No login needed.
check_for_update_on_startup = false
sandbox_mode = "danger-full-access"
approval_policy = "on-request"
model = "gpt-5.5"
model_provider = "fake"

[model_providers.fake]
name = "fake"
base_url = "http://127.0.0.1:18080/v1"
wire_api = "responses"
requires_openai_auth = false

[features]
daemon_auto_start = false
