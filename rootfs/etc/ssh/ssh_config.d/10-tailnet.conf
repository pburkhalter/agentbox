# Tailnet hosts are reached through a Tailscale sidecar's SOCKS5 proxy on
# 127.0.0.1:1055 (see "Tailscale sidecar" in the README). Matches MagicDNS
# names and the tailnet address range 100.64.0.0/10. Without a sidecar these
# hosts are unreachable either way, so the rule costs nothing.
Host *.ts.net 100.64.* 100.65.* 100.66.* 100.67.* 100.68.* 100.69.* 100.7?.* 100.8?.* 100.9?.* 100.10?.* 100.11?.* 100.120.* 100.121.* 100.122.* 100.123.* 100.124.* 100.125.* 100.126.* 100.127.*
    ProxyCommand nc -X 5 -x 127.0.0.1:1055 %h %p
