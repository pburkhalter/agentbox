name: release

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  # Weekly rebuild for Debian security updates, even without a dependency
  # change. Also dispatched by ci.yaml after a Dependabot auto-merge.
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # A red run must not publish :latest: this is the image the NAS pulls.
  verify:
    uses: ./.github/workflows/ci.yaml
    # GitHub checks the permissions of every job in the called workflow,
    # including ci.yaml's automerge, which only runs on pull requests and is
    # skipped here. lint and image keep contents: read.
    permissions:
      contents: write
      pull-requests: write
      actions: write

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/agentbox
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value={{date 'YYYY.MM.DD'}}-{{sha}}
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}

      # Same build as the verify job; its layers come from the cache it wrote.
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/agentbox
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: summary
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "## Published"
            echo
            echo "digest: \`$DIGEST\`"
            echo
            echo '```'
            echo "$TAGS"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
